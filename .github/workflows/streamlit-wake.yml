name: Verifica e riattiva Scrittore Site

on:
  schedule:
    # Orario UTC; il minuto 17 riduce i ritardi tipici dei lavori avviati all'ora piena.
    # Ogni 2 ore: GitHub ritarda spesso i lavori programmati (nei registri gli
    # intervalli reali con "ogni 4 ore" arrivavano a 10-14 ore), mentre
    # Streamlit Community Cloud addormenta l'app dopo circa 12 ore senza visite.
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: streamlit-wake
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    # Installazione del browser (1-2 minuti) + controllo (al massimo 3 minuti).
    timeout-minutes: 6
    steps:
      # Versioni v5: girano su Node 24 (niente avviso "Node.js 20 deprecated").
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Installa il browser di controllo
        run: |
          npm install --no-save --no-package-lock playwright@1.64.0
          npx playwright install --with-deps --only-shell chromium
      - name: Visita la home e riattiva l'app se dorme
        timeout-minutes: 4
        env:
          STREAMLIT_URL: https://scrittoresite.streamlit.app/
        run: node .github/scripts/wake-streamlit.mjs
